[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-token-meter"
version = "0.1.0"
description = "Measure Claude Code token usage per session and per subagent from local JSONL logs"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
claude-token-meter = "claude_token_meter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
